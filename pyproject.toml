[project]
name = "aether-btc"
version = "0.1.0"
description = "GA-optimized crypto daytrading system for BTC/USDT on Binance Futures"
requires-python = ">=3.12"
dependencies = [
    # Data processing
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    # Technical analysis
    "ta>=0.11.0",
    # Exchange API
    "python-binance>=1.0.19",
    # Database
    "psycopg2-binary>=2.9.9",
    "sqlalchemy[asyncio]>=2.0.25",
    "alembic>=1.13.0",
    # Configuration
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    # Logging
    "structlog>=24.1.0",
    # Scheduling
    "apscheduler>=3.10.0",
    # Alerts
    "python-telegram-bot>=21.0",
    # Dashboard
    "dash>=2.0.0",
    "plotly>=5.0.0",
    # Utilities
    "tenacity>=8.2.0",
    "tqdm>=4.66.0",
    # Async
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.98.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pandas-stubs>=2.1.0",
    "types-requests>=2.31.0",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "ANN", "S", "TCH"]
ignore = ["E501", "ANN101", "ANN102", "ANN401", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["aether_btc"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=src/aether_btc --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/aether_btc"]
omit = ["tests/*"]
